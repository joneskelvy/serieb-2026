<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Calendário de Jogos - Série B 2026
  </title>

  <!-- FAVICON -->
  <link
    rel="icon"
    type="image/png"
    href="./assets/icon-192.png"
  />

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css"
  />

  <!-- FONTES -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  />

  <!-- PWA -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="Série B 2026"
  />

  <link
    rel="apple-touch-icon"
    href="./assets/icon-192.png"
  />

</head>

<body>

  <div id="app">

    <!-- HEADER -->

    <header>

      <img
        src="./assets/brasileirob.png"
        alt="Brasileirão Série B 2026"
      />

    </header>

    <!-- MENU -->

    <nav class="menu">

      <button class="menu-btn active" id="btnGames">
        Jogos
      </button>

      <button class="menu-btn" id="btnTable">
        Classificação
      </button>

    </nav>

    <!-- TELA DE JOGOS -->

    <section id="gamesScreen">

      <div class="filters">

        <select id="roundFilter">

          <option value="all">
            Todas as Rodadas
          </option>

          <option value="1">1ª Rodada</option>
          <option value="2">2ª Rodada</option>
          <option value="3">3ª Rodada</option>
          <option value="4">4ª Rodada</option>
          <option value="5">5ª Rodada</option>
          <option value="6">6ª Rodada</option>
          <option value="7">7ª Rodada</option>
          <option value="8">8ª Rodada</option>
          <option value="9">9ª Rodada</option>
          <option value="10">10ª Rodada</option>
          <option value="11">11ª Rodada</option>
          <option value="12">12ª Rodada</option>
          <option value="13">13ª Rodada</option>  
          <option value="14">14ª Rodada</option>
          <option value="15">15ª Rodada</option>
          <option value="16">16ª Rodada</option>
          <option value="17">17ª Rodada</option>
          <option value="18">18ª Rodada</option>

        </select>

      </div>

      <main id="cards">

        <!-- Jogos renderizados via JS -->

      </main>

    </section>

    <!-- TELA DE CLASSIFICAÇÃO -->

    <section id="tableScreen" class="hidden">

      <div class="table-container">

        <h2 class="table-title">
  Tabela de Classificação
</h2>

        <table>

<div class="table-wrapper">

  <table>

    <thead>
      <tr>
        <th>#</th>
       <th>CLUBE</th>
        <th>PTS</th>
        <th>J</th>
        <th>V</th>
        <th>E</th>
        <th>D</th>
        <th>SG</th>
        <th>ÚLTIMOS JOGOS</th>
      </tr>
    </thead>

    <tbody id="classificationTable"></tbody>

  </table>

</div>
    </section>

  </div>

  <!-- JS -->

  <script
    src="./main.js"
    defer
  ></script>

</body>


</html>
